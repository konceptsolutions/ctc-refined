server {
    listen 172.31.7.110:443 ssl;
    server_name www.crystaltrading.net;
    return 301 https://crystaltrading.net$request_uri;

    ssl_certificate /etc/letsencrypt/live/crystaltrading.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crystaltrading.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 172.31.7.110:443 ssl;
    server_name crystaltrading.net;

    root /var/www/ctc;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /api/ {
        proxy_pass http://localhost:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://localhost:5001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    ssl_certificate /etc/letsencrypt/live/crystaltrading.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crystaltrading.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 172.31.7.110:80;
    server_name crystaltrading.net www.crystaltrading.net;
    return 301 https://crystaltrading.net$request_uri;
}
